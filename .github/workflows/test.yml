name: test

on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make generate
      - name: Fail when generated code is out of date
        run: |
          git diff --compact-summary --exit-code -- internal/provider/generated.go internal/provider/generated_datasources.go || \
            (echo "Generated code is stale. Run 'make generate' and commit the result."; exit 1)
      - run: make docs
      - name: Fail when docs are out of date
        run: |
          git diff --compact-summary --exit-code -- docs || \
            (echo "Documentation is stale. Run 'make docs' and commit the result."; exit 1)

  acceptance:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: ./scripts/acceptance-server.sh
      - run: go test -v -cover ./internal/provider -timeout 15m
        env:
          TF_ACC: "1"
          STALWART_URL: http://127.0.0.1:18080
          STALWART_USER: admin
          STALWART_PASSWORD: acctest123
        timeout-minutes: 15

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.9.*"
          - "1.10.*"
          - "1.11.*"
          - "1.15.*"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - run: go test -v -cover ./...
        timeout-minutes: 10
